name: Validate Apps Script

# Runs on every PR touching apps_script/. Catches broken code before it can be
# merged + auto-deployed to the live sheet: the manifest must be valid JSON and
# no source file may be empty. Make this a required check (Settings -> Branches)
# so auto-merge waits for it to pass.
on:
  pull_request:
    paths:
      - "apps_script/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest is valid JSON
        run: |
          python3 -c "import json; json.load(open('apps_script/appsscript.json'))"
          echo "appsscript.json is valid JSON"

      - name: Check no source file is empty
        run: |
          empty=$(find apps_script -name '*.gs' -o -name '*.html' | while read -r f; do
            [ -s "$f" ] || echo "$f"
          done)
          if [ -n "$empty" ]; then
            echo "::error::These source files are empty:"
            echo "$empty"
            exit 1
          fi
          echo "All source files are non-empty"
