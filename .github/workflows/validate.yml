name: Validate Apps Script

# Runs on PRs touching either Apps Script project. Catches broken code before it
# can merge + auto-deploy: every appsscript.json must be valid JSON and no source
# file may be empty.
on:
  pull_request:
    paths:
      - "apps_script/**"
      - "st_estimate_proxy/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests are valid JSON
        run: |
          for m in apps_script/appsscript.json st_estimate_proxy/appsscript.json; do
            if [ -f "$m" ]; then
              python3 -c "import json,sys; json.load(open('$m'))" && echo "OK: $m"
            fi
          done

      - name: Check no source file is empty
        run: |
          empty=$(find apps_script st_estimate_proxy \( -name '*.gs' -o -name '*.html' \) 2>/dev/null | while read -r f; do
            [ -s "$f" ] || echo "$f"
          done)
          if [ -n "$empty" ]; then
            echo "::error::These source files are empty:"
            echo "$empty"
            exit 1
          fi
          echo "All source files are non-empty"
